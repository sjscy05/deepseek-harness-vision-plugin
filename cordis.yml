# Patch overlay that inserts the vision plugin into the web profile.
# Usage (from the repository root):
#   pnpm dsh --profile web --patch ./vision-plugin/cordis.yml
# Plugin paths in a patch must be ABSOLUTE and, on Windows, take the
# file:/// URL form below (the ESM loader rejects bare drive-letter paths);
# adjust the path if this checkout lives elsewhere.
#
# Switching vision vendors = change ONE line: `provider:` below.
# API keys are NOT written here — the plugin reads each vendor's key from
# the repo-root .env (gitignored) automatically:
#   zhipu    → ZHIPU_API_KEY        qwen     → QWEN_API_KEY
#   doubao   → ARK_API_KEY          openai   → OPENAI_API_KEY
#   anthropic→ ANTHROPIC_API_KEY    gemini   → GEMINI_API_KEY
# (A block may still override with its own apiKey: literal.)
# baseUrl and model may be overridden per block; empty baseUrl uses the
# vendor default, and model: is required per block.
- insert:
    - id: vision
      name: 'file:///D:/deepseek-harness/vision-plugin/src/index.ts'
      config:
        # Current vendor (serving vision_read calls):
        provider: zhipu
        # All vendors preconfigured; keep the blocks you use, delete the rest.
        openai:
          model: 'gpt-4o-mini'
        zhipu:
          model: 'glm-4v-flash'        # free; glm-4v-plus is stronger
        qwen:
          model: 'qwen-vl-plus'
        doubao:
          model: 'doubao-1.5-vision-pro-32k-250115'
        anthropic:
          model: 'claude-sonnet-4-5'
        gemini:
          model: 'gemini-2.0-flash'
        # Shared budgets (defaults shown; omit to accept them):
        # timeoutMs: 60000
        # maxImageBytes: 10485760
        # maxOutputChars: 20000
        # defaultQuestion: 'Describe the image in detail, including any visible text.'
